# Render Blueprint — deploys the Python search engine as an always-on web service.
# The Next.js app (deployed on Freebuff/Vercel) proxies search calls here via the
# SEARCH_ENGINE_URL environment variable.
#
# To deploy: connect this repo to Render, pick "Blueprint", and Render will create
# the service automatically. The free plan works; it sleeps after ~15 min of idle
# (first request wakes it in ~30-60s).
services:
  - type: web
    name: chemical-data-extractor
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
